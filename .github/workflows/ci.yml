name: ci

on:
  push:
  pull_request:

env:
  HONE_SUBNET_COMMIT: d5786a9bfd3a52cf8e89795d196a7d40cc3d2751

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hone-subnet-org/hone-subnet
          ref: ${{ env.HONE_SUBNET_COMMIT }}
          path: hone-subnet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './hone-subnet[miner]' -e '.[dev]'
      - run: ruff check honeminer tests
      - run: pytest -q -m "not docker and not live"

  docker:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hone-subnet-org/hone-subnet
          ref: ${{ env.HONE_SUBNET_COMMIT }}
          path: hone-subnet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './hone-subnet[miner]' -e '.[dev]'
      - name: Pull the pinned grading image
        run: docker pull "$(python -c 'from rlvr.policy import RELEASE_POLICY; print(RELEASE_POLICY.v3_image)')"
      - name: Docker tests (exit 5 = none collected yet)
        run: pytest -q -m docker || [ $? -eq 5 ]
